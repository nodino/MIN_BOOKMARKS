name: Build & Release

on:
  push:
    tags:
      - 'v*'   # trigger on version tags like v1.0.0

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      npm_config_build_from_source: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean and install dependencies
        run: |
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install
          npm rebuild

      - name: Build executable
        run: npm run build:pkg

      - name: Package executable and assets
        run: |
          if (Test-Path dist) {
            Compress-Archive -Path min-markers.exe, dist -DestinationPath min-markers.zip -Force
          } else {
            Write-Host "dist folder not found, packaging only exe"
            Compress-Archive -Path min-markers.exe -DestinationPath min-markers.zip -Force
          }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: min-markers.zip
